    (function() {
      function isAdSenseTagError(err) {
        var str = (err && (err.message || err.name || String(err))) || '';
        return str.indexOf('adsbygoogle') !== -1 ||
               str.indexOf('TagError') !== -1 ||
               str.indexOf('availableWidth') !== -1 ||
               str.indexOf('already have ads') !== -1 ||
               str.indexOf('No slot size') !== -1;
      }
      window.addEventListener('error', function(event) {
        if (isAdSenseTagError(event.message) || isAdSenseTagError(event.error)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
        // Auto-recovery if JS script bundle or CSS load fails (e.g., stale service worker / chunk hash change on deployment)
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          console.warn('[Deployment Recovery] Asset load error:', event.target.src || event.target.href);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var reg of registrations) { reg.unregister(); }
            });
          }
          if (!sessionStorage.getItem('deploy_reload_retry')) {
            sessionStorage.setItem('deploy_reload_retry', '1');
            window.location.reload(true);
          }
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (isAdSenseTagError(event.reason)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      var origOnError = window.onerror;
      window.onerror = function(msg, url, line, col, error) {
        if (isAdSenseTagError(msg) || isAdSenseTagError(error)) {
          return true;
        }
        if (origOnError) return origOnError.apply(this, arguments);
        return false;
      };
