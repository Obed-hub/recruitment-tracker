<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <title>Nigeria Military Recruitment Tracker</title>
  <meta name="description" content="A comprehensive tracking system for Nigerian Army, Navy, and Air Force recruitments with eligibility checkers and status updates." />

  <!-- Search Engine Crawlers & Indexing Directives -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="bingbot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://recruitmenttracker.com.ng/" />

  <!-- Author and Publisher Identification -->
  <meta name="author" content="Nigeria Recruitment Tracker" />
  <meta name="publisher" content="Nigeria Recruitment Tracker" />
  <meta name="application-name" content="Nigeria Recruitment Tracker" />

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="Nigeria Recruitment Tracker" />
  <meta property="og:locale" content="en_NG" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://recruitmenttracker.com.ng/" />
  <meta property="og:title" content="Nigeria Military Recruitment Tracker" />
  <meta property="og:description" content="A comprehensive tracking system for Nigerian Army, Navy, and Air Force recruitments with eligibility checkers and status updates." />
  <meta property="og:image" content="https://recruitmenttracker.com.ng/assets/logo.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nigeria Military Recruitment Tracker" />
  <meta name="twitter:description" content="A comprehensive tracking system for Nigerian Army, Navy, and Air Force recruitments with eligibility checkers and status updates." />
  <meta name="twitter:image" content="https://recruitmenttracker.com.ng/assets/logo.png" />

  <!-- Static Schema.org Graph for Instant Search Sitelinks & Brand Knowledge Panel -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://recruitmenttracker.com.ng/#website",
        "url": "https://recruitmenttracker.com.ng",
        "name": "Nigeria Recruitment Tracker",
        "description": "Comprehensive tracking portal for Nigerian Army, Navy, Police, and federal paramilitary recruitments.",
        "publisher": {
          "@id": "https://recruitmenttracker.com.ng/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://recruitmenttracker.com.ng/recruitments?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": "en-NG"
      },
      {
        "@type": "Organization",
        "@id": "https://recruitmenttracker.com.ng/#organization",
        "name": "Nigeria Recruitment Tracker",
        "url": "https://recruitmenttracker.com.ng",
        "logo": {
          "@type": "ImageObject",
          "url": "https://recruitmenttracker.com.ng/assets/logo.png"
        }
      }
    ]
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            military: {
              green: '#006400',
              blue: '#000080',
              gold: '#FFD700',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
  <script>
    (function() {
      function isAdSenseTagError(err) {
        var str = (err && (err.message || err.name || String(err))) || '';
        return str.indexOf('adsbygoogle') !== -1 ||
               str.indexOf('TagError') !== -1 ||
               str.indexOf('availableWidth') !== -1 ||
               str.indexOf('already have ads') !== -1 ||
               str.indexOf('No slot size') !== -1;
      }
      window.addEventListener('error', function(event) {
        if (isAdSenseTagError(event.message) || isAdSenseTagError(event.error)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (isAdSenseTagError(event.reason)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      var origOnError = window.onerror;
      window.onerror = function(msg, url, line, col, error) {
        if (isAdSenseTagError(msg) || isAdSenseTagError(error)) {
          return true;
        }
        if (origOnError) return origOnError.apply(this, arguments);
        return false;
      };
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
